<!DOCTYPE html>
<!-- `data-culture` fija el idioma por defecto de la interfaz: globalize lo lee
     en getDefaultLanguage antes que el idioma del navegador, así que la app
     arranca en español independientemente de la cultura del sistema. Quien
     cambie el idioma en Ajustes lo sobreescribe (userSettings.language). -->
<html class="preload" dir="ltr" lang="es" data-culture="es">
<head>
    <meta charset="utf-8">
    <!-- El zoom queda habilitado (accesibilidad): `user-scalable=no` /
         `maximum-scale=1` impedían ampliar la interfaz a quien lo necesita.
         El retardo de 300 ms del doble-tap ya no depende de esto: lo elimina
         `touch-action: manipulation` en los controles táctiles (global.css).
         Sin `interactive-widget`: con el valor por defecto (resizes-visual)
         el teclado virtual no encoge el viewport de layout, así que la
         bottom nav se queda detrás del teclado en vez de flotar sobre él. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5, viewport-fit=cover">
    <link rel="manifest" href="manifest.json">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <meta http-equiv="X-UA-Compatibility" content="IE=Edge">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="Jellyfin">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="referrer" content="no-referrer">

    <!-- Color del PRIMER PINTADO: tiene que estar en el HTML porque se aplica
         antes de que corra nada de JS. De ahí en adelante lo reescribe el tema
         activo (themes/themeColor.ts). El valor es el fondo del tema oscuro,
         que es el de por defecto, para que no haya salto al cargar. -->
    <meta id="themeColor" name="theme-color" content="#101010">

    <!-- Icono propio: la silueta del logo en blanco sobre el negro del tema.
         El .ico del paquete queda de respaldo para navegadores que no acepten
         un PNG como favicon. -->
    <link rel="icon" type="image/png" sizes="512x512" href="assets/img/jellyfin-icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/img/jellyfin-icon-180.png">
    <link rel="shortcut icon" href="../node_modules/@jellyfin/ux-web/favicons/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <title>Jellyfin</title>

    <style>
        .transparentDocument,
        .backgroundContainer-transparent:not(.withBackdrop) {
            background: none !important;
            background-color: transparent !important;
        }

        .layout-tv .mouseIdle,
        .layout-tv .mouseIdle button,
        .layout-tv .mouseIdle select,
        .layout-tv .mouseIdle input,
        .layout-tv .mouseIdle textarea,
        .layout-tv .mouseIdle a,
        .layout-tv .mouseIdle label,
        .transparentDocument .mouseIdle,
        .transparentDocument .mouseIdle button,
        .transparentDocument .mouseIdle select,
        .transparentDocument .mouseIdle input,
        .transparentDocument .mouseIdle textarea,
        .transparentDocument .mouseIdle a,
        .transparentDocument .mouseIdle label,
        .screensaver-noScroll.mouseIdle,
        .screensaver-noScroll.mouseIdle button,
        .screensaver-noScroll.mouseIdle select,
        .screensaver-noScroll.mouseIdle input,
        .screensaver-noScroll.mouseIdle textarea,
        .screensaver-noScroll.mouseIdle a,
        .screensaver-noScroll.mouseIdle label {
            cursor: none !important;
        }

        .preload {
            background-color: #101010;
        }

        .hide,
        .layout-desktop .hide-desktop,
        .layout-mobile .hide-mobile,
        .layout-tv .hide-tv,
        .mouseIdle .hide-mouse-idle,
        .mouseIdle-tv .hide-mouse-idle-tv {
            display: none !important;
        }

        .mainDrawerHandle {
            position: fixed;
            top: 0;
            bottom: 0;
            z-index: 1;
            width: 0.8em;
            padding-left: env(safe-area-inset-left);
            caret-color: transparent;
        }

        [dir="ltr"] .mainDrawerHandle {
            left: 0;
        }

        [dir="rtl"] .mainDrawerHandle {
            left: 0;
        }
    </style>
</head>
<body dir="ltr">
    <div id="reactRoot">
        <div class="splashLogo"></div>
    </div>
</body>
</html>
